# يبني APK تلقائياً بسيرفرات GitHub السحابية عند كل رفع (push) — بدون أي
# حاجة لكمبيوتر أو تثبيت Flutter محلياً. يعيد استخدام نفس سكربت
# build_flutter_apk.mjs بالضبط (Node.js متوفر جاهز على عدّائات GitHub).
name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: بناء APK (نفس سكربت الأتمتة المحلي)
        run: node build_flutter_apk.mjs

      - name: رفع ملف APK كمرفق تحميل
        uses: actions/upload-artifact@v4
        with:
          name: karti-app-release-apk
          path: karti_app/build/app/outputs/flutter-apk/app-release.apk
