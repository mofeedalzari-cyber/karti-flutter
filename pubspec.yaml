name: karti
description: كرتي — تطبيق إدارة كروت شبكات الواي فاي (نسخة Flutter)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الحالة والتوجيه
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # الباك اند — نفس قاعدة بيانات Supabase الحالية بدون أي تغيير
  supabase_flutter: ^2.8.0

  # الإشعارات (Firebase — نفس مشروع kary-95ae6-a5e60 الحالي)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # الخط العربي (Cairo) — نفس الخط المستخدم بالنسخة الحالية
  google_fonts: ^6.2.1

  # أدوات عامة
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.2 # للرسوم البيانية بلوحة التحكم
  pdf: ^3.11.1 # توليد كروت/فواتير/تقارير PDF
  printing: ^5.13.4
  share_plus: ^10.1.3 # مشاركة الفواتير/الكروت/النسخ الاحتياطي (واتساب/مشاركة عامة)
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2 # اختيار جهة اتصال (بديل حديث لـ @capacitor-community/contacts)
  file_picker: ^8.1.4 # لرفع الكروت من ملف (TXT/CSV/JSON)
  async: ^2.11.0 # لقراءة بروتوكول API الميكروتك الثنائي عبر Socket مباشرة
  syncfusion_flutter_pdf: ^27.2.5 # لاستخراج النص من ملفات PDF المرفوعة (رفع الكروت)
  excel: ^4.0.6 # تصدير تقارير Excel (رخصة MIT، بدون قيود ترخيص خلافاً لـ Syncfusion)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
