workflows:
  flutter-android-release:
    name: Build Flutter Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
      node: latest
    scripts:
      - name: Build APK (نفس سكربت الأتمتة المحلي — ينشئ مشروع Flutter، ينسخ الملفات، ويبني)
        script: |
          node build_flutter_apk.mjs
    artifacts:
      - karti_app/build/app/outputs/flutter-apk/app-release.apk
      - karti_app/build/app/outputs/**/*.apk
